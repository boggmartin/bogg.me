<!DOCTYPE html>
<html lang="sv">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Boggma AB</title>
	<meta name="description" content="Boggma AB drivs av Bogg Martin Nåtby: rådgivning, projektledning och snickerier." />
	<meta name="theme-color" content="#f7f6f3" />
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1a2e'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='system-ui,Arial,sans-serif' font-size='38' font-weight='600' fill='%23ffffff'%3EB%3C/text%3E%3C/svg%3E" />
	<style>
		:root {
			--paper: #f7f6f3;
			--ink: #1b2431;
			--muted: #4d5663;
			--line: #c9c6bf;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			background: var(--paper);
			color: var(--ink);
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			font-size: 1.0625rem;
			line-height: 1.7;
			-webkit-font-smoothing: antialiased;
		}

		main {
			flex: 1;
			display: flex;
			align-items: center;
			padding: 4rem 1.5rem;
		}

		.content {
			width: 100%;
			max-width: 34rem;
			margin: 0 auto;
		}

		h1 {
			font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
			font-size: clamp(1.9rem, 4vw, 2.4rem);
			font-weight: 400;
			letter-spacing: 0.04em;
			line-height: 1.2;
			padding-bottom: 1.25rem;
			margin-bottom: 1.75rem;
			border-bottom: 1px solid var(--ink);
		}

		p { color: var(--muted); }

		p + p { margin-top: 1.25rem; }

		a { color: var(--ink); text-underline-offset: 0.2em; text-decoration-thickness: 1px; }

		a:hover, a:focus-visible { text-decoration-thickness: 2px; }

		footer {
			padding: 1.5rem;
			border-top: 1px solid var(--line);
		}

		.icons {
			list-style: none;
			display: flex;
			gap: 1.5rem;
			max-width: 34rem;
			margin: 0 auto;
			font-size: 1.1rem;
		}

		.icons a { display: inline-flex; color: var(--muted); }

		.icons a:hover, .icons a:focus-visible { color: var(--ink); }

		.icons svg { height: 1em; width: auto; fill: currentColor; }
	</style>
</head>
<body>
	<main>
		<div class="content">
			<h1>Boggma AB</h1>
			<p>Boggma drivs av mig, Bogg Martin Nåtby. Jag arbetar bland annat med rådgivning, projektledning och snickerier.</p>
			<p>Kontakta mig: <a href="mailto:martin@boggma.se">martin@boggma.se</a></p>
		</div>
	</main>
