<!DOCTYPE html>
<html lang="sv">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Boggma AB</title>
	<meta name="description" content="Boggma AB drivs av Bogg Martin Andersson: rådgivning, projektledning och snickerier." />
	<meta name="theme-color" content="#0b1a2e" />
	<link rel="icon" href="images/icon.gif" />
	<style>
		:root {
			--ink: #ffffff;
			--muted: rgba(255, 255, 255, 0.65);
			--faint: rgba(255, 255, 255, 0.45);
			--accent: #7fd4ff;
			--night: #050b14;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		html { background: var(--night); }

		body {
			min-height: 100vh;
			color: var(--ink);
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			font-size: 1.0625rem;
			line-height: 1.65;
			letter-spacing: 0.02em;
			-webkit-font-smoothing: antialiased;
			/* Natthimmel: mörkt ovanför, blått mot horisonten */
			background:
				radial-gradient(ellipse 55% 30% at 50% 30%, rgba(64, 128, 196, 0.20), transparent 70%),
				radial-gradient(ellipse 110% 22% at 50% 64%, rgba(40, 104, 164, 0.45), transparent 75%),
				linear-gradient(180deg, #050b14 0%, #0b1a2e 38%, #12365a 62%, #0a1828 82%, #050b14 100%);
			display: flex;
			flex-direction: column;
		}

		/* Stjärnor: små radiella punkter i ett upprepat mönster */
		body::before {
			content: "";
			position: fixed;
			inset: 0;
			pointer-events: none;
			opacity: 0.55;
			background-image:
				radial-gradient(1px 1px at 12% 18%, #fff, transparent),
				radial-gradient(1px 1px at 37% 72%, #fff, transparent),
				radial-gradient(1.5px 1.5px at 68% 31%, #fff, transparent),
				radial-gradient(1px 1px at 84% 64%, #fff, transparent),
				radial-gradient(1px 1px at 23% 47%, rgba(255,255,255,0.8), transparent),
				radial-gradient(1px 1px at 55% 12%, rgba(255,255,255,0.8), transparent),
				radial-gradient(1.5px 1.5px at 91% 9%, #fff, transparent),
				radial-gradient(1px 1px at 6% 83%, rgba(255,255,255,0.7), transparent),
				radial-gradient(1px 1px at 47% 41%, rgba(255,255,255,0.7), transparent),
				radial-gradient(1px 1px at 75% 88%, rgba(255,255,255,0.7), transparent);
			background-size: 340px 340px;
		}

		a { color: inherit; }

		header.site {
			position: relative;
			padding: 1.25rem 1.5rem;
			font-size: 0.8rem;
			font-weight: 600;
			letter-spacing: 0.22em;
			text-transform: uppercase;
		}

		header.site a { text-decoration: none; }

		main {
			position: relative;
			flex: 1;
			display: flex;
			flex-direction: column;
		}

		.hero {
			min-height: 62vh;
			display: grid;
			place-items: center;
			text-align: center;
			padding: 2rem 1.5rem;
		}

		.hero h1 {
			font-size: clamp(1.25rem, 3vw, 1.75rem);
			font-weight: 400;
			letter-spacing: 0.35em;
			text-transform: uppercase;
			padding: 1.1em 0;
			border-top: 2px solid rgba(255, 255, 255, 0.85);
			border-bottom: 2px solid rgba(255, 255, 255, 0.85);
		}

		.about {
			text-align: center;
			padding: 3rem 1.5rem 4rem;
		}

		.about p {
			max-width: 34rem;
			margin: 0 auto;
			color: var(--muted);
		}

		.about p + p { margin-top: 1.5rem; }

		.about a {
			color: var(--ink);
			text-decoration: none;
			border-bottom: 1px dotted var(--faint);
		}

		.about a:hover, .about a:focus-visible { color: var(--accent); border-bottom-color: var(--accent); }

		footer {
			position: relative;
			text-align: center;
			padding: 1rem 1.5rem 3rem;
		}

		.icons {
			list-style: none;
			display: flex;
			justify-content: center;
			gap: 1.75rem;
			font-size: 1.25rem;
		}

		.icons a {
			display: inline-flex;
			color: var(--faint);
			transition: color 0.2s ease;
		}

		.icons a:hover, .icons a:focus-visible { color: var(--ink); }

		.icons svg { height: 1em; width: auto; fill: currentColor; }

		@media (prefers-reduced-motion: reduce) {
			.icons a { transition: none; }
		}
	</style>
</head>
<body>
	<header class="site">
		<a href="/">Bogg Martin Andersson</a>
	</header>

	<main>
		<section class="hero">
			<h1>Boggma AB</h1>
		</section>

		<section class="about">
			<p>Boggma drivs av mig, Bogg Martin Andersson. Jag arbetar bland annat med rådgivning, projektledning och snickerier.</p>
			<p>Kontakta mig: <a href="mailto:martin@boggma.se">martin@boggma.se</a></p>
		</section>
	</main>

	<footer>

		</ul>

</body>
</html>
